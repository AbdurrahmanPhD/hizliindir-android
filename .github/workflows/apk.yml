name: APK derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Dosya adlarını düzenle
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/debug/*.apk; do
            n=$(basename "$f" | sed 's/app-/HizliIndir-/; s/-debug//')
            cp "$f" "out/$n"
          done
          ls -la out

      - name: Derleme çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: HizliIndir-apk
          path: out/*.apk

      - name: Sürüm (Releases) sayfasına yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Hızlıİndir 0.1.${{ github.run_number }}
          body: |
            Çoğu telefon için **HizliIndir-arm64-v8a.apk** dosyasını indirin.
            Emin değilseniz **HizliIndir-universal.apk** her telefonda çalışır (daha büyüktür).
          files: out/*.apk
